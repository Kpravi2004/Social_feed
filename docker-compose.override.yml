# Docker Compose loads this automatically alongside docker-compose.yml
# whenever you run plain `docker compose up` — no flags needed. It swaps
# in the HTTP-only local config and drops the 443 port mapping, so local
# dev never touches the production TLS config at all.
#
# On the VPS, deploy.yml runs with -f docker-compose.yml only (see the
# "Rebuild and restart containers" step), which skips this file entirely
# and uses the real nginx.conf with TLS.

services:
  nginx:
    # Port 80 is already mapped in docker-compose.yml — not repeated here
    # to avoid a duplicate host-port binding when Compose merges the two
    # files. Only the config and build path actually need to change.
    volumes:
      - ./nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
