# Nginx reverse proxy + load balancer for the Scalable Social Feed API
# Terminates TLS, load-balances across Node instances, proxies WebSocket
# connections separately, and serves the React static build.
#
# This file is mounted as /etc/nginx/conf.d/default.conf. The official
# nginx image's main nginx.conf already wraps conf.d/*.conf inside its
# http{} block, so directives here at the top level (outside server{})
# are still in http context — that's what makes limit_req_zone valid here.

# --- Upstream pool: round-robin across two Node API instances ---
upstream api_backend {
    server api-1:4000;
    server api-2:4000;
}

# --- Edge-level rate limiting, paired with the app-level Redis limiter ---
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# --- Redirect all plain HTTP to HTTPS ---
server {
    listen 80;
    server_name yourdomain.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name yourdomain.duckdns.org;

    # Certbot-issued certs (mounted into the container)
    ssl_certificate     /etc/letsencrypt/live/yourdomain.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.duckdns.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # --- REST API traffic: load-balanced across api-1 / api-2 ---
    location /api/ {
        proxy_pass http://api_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Basic edge-level rate limiting (paired with your app-level limiter)
        limit_req zone=api_limit burst=20 nodelay;
    }

    # --- WebSocket traffic: needs the Upgrade/Connection headers ---
    location /ws/ {
        # No trailing slash/URI on proxy_pass: the full /ws/notifications
        # path must reach Node unchanged (a trailing slash would strip /ws/).
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # --- Static React build ---
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # --- Prometheus metrics endpoint, restricted to internal network ---
    location /metrics {
        proxy_pass http://api_backend/metrics;
        allow 172.16.0.0/12;
        deny all;
    }
}
