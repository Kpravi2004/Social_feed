# Local development variant — plain HTTP, no TLS, no domain required.
# Used automatically via docker-compose.override.yml so nobody has to
# remember to hand-edit the production nginx.conf and risk deploying
# with TLS accidentally disabled.

upstream api_backend {
    server api-1:4000;
    server api-2:4000;
}

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 80;

    location /api/ {
        proxy_pass http://api_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_req zone=api_limit burst=20 nodelay;
    }

    location /ws/ {
        # No trailing slash/URI on proxy_pass: the full /ws/notifications
        # path must reach Node unchanged (a trailing slash would strip /ws/).
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    location /metrics {
        proxy_pass http://api_backend/metrics;
        allow 172.16.0.0/12;
        deny all;
    }
}
